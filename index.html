<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <meta name="theme-color" content="#1e40af" />
  <meta name="description" content="My Planner Pro — Organizador profesional de tareas y eventos" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="My Planner" />
  <title>My Planner Pro</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
   <!-- ✅ Favicon para navegadores modernos (Chrome, Firefox, Edge) -->
  <link rel="icon" href="cheque.png" type="image/png" sizes="32x32">

  <!-- ✅ Favicon alternativo de alta resolución -->
  <link rel="icon" href="cheque.png" type="image/png" sizes="512x512">

  <!-- ✅ Icono para iOS al guardar en pantalla de inicio -->

  <!-- ✅ Para PWA (si tu app es instalable) -->

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class', theme: { extend: {} } }</script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- React + ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { margin: 0; overscroll-behavior: none; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 2px; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes ping {
      75%, 100% { transform: scale(2); opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }

    .animate-in { animation: fadeIn 0.2s ease forwards; }
    .fade-in { animation-name: fadeIn; }
    .zoom-in-95 { animation: zoomIn 0.15s ease forwards; }
    .slide-in-from-bottom-6 { animation: slideUp 0.3s ease forwards; }
    .slide-in-from-top-4 { animation: fadeIn 0.3s ease forwards; }
    .animate-spin { animation: spin 1s linear infinite; }
    .animate-ping { animation: ping 1s cubic-bezier(0, 0, 0.2, 1) infinite; }
    .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

    /* Safe area */
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }

    /* PWA Install Banner */
    #pwa-banner { display: none; }
    #pwa-banner.visible { display: flex; }

    /* ios status bar */
    @supports (padding-top: env(safe-area-inset-top)) {
      .safe-top { padding-top: env(safe-area-inset-top); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- PWA Install Banner -->
  <div id="pwa-banner" style="position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#1e40af;color:white;padding:16px;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -4px 20px rgba(0,0,0,0.3)">
    <div style="display:flex;align-items:center;gap:12px">
      <span style="font-size:28px">📋</span>
      <div>
        <p style="margin:0;font-weight:700;font-size:14px">Instalar My Planner Pro</p>
        <p style="margin:0;font-size:12px;opacity:0.85">Accede sin internet · Funciona como app nativa</p>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-shrink:0">
      <button id="pwa-install-btn" style="background:white;color:#1e40af;font-weight:700;font-size:13px;padding:9px 18px;border-radius:12px;border:none;cursor:pointer">Instalar</button>
      <button id="pwa-dismiss-btn" style="background:rgba(255,255,255,0.2);color:white;font-weight:700;font-size:16px;padding:9px 13px;border-radius:12px;border:none;cursor:pointer">✕</button>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ============ ICONOS (desde lucide global) ============
    const Icon = ({ name, size = 16, className = '' }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          ref.current.innerHTML = '';
          const svgStr = lucide.icons[name];
          if (!svgStr) return;
          // lucide UMD exposes createIcons differently; use direct SVG creation
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
          svg.setAttribute('width', size);
          svg.setAttribute('height', size);
          svg.setAttribute('viewBox', '0 0 24 24');
          svg.setAttribute('fill', 'none');
          svg.setAttribute('stroke', 'currentColor');
          svg.setAttribute('stroke-width', '2');
          svg.setAttribute('stroke-linecap', 'round');
          svg.setAttribute('stroke-linejoin', 'round');
          if (className) svg.setAttribute('class', className);
          const iconData = lucide.icons[name];
          if (iconData && iconData[2]) {
            iconData[2].forEach(([tag, attrs]) => {
              const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
              Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
              svg.appendChild(el);
            });
          }
          ref.current.appendChild(svg);
        }
      }, [name, size, className]);
      return <span ref={ref} style={{display:'inline-flex',alignItems:'center',flexShrink:0}} />;
    };

    // Fallback simple icons via SVG strings
    const icons = {
      CalendarIcon: ({size=16,className=''}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
      ),
      CheckCircle2: ({size=16,className=''}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/>
        </svg>
      ),
      Circle: ({size=16,className=''}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/></svg>
      ),
      Clock: ({size=16,className=''}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
      ),
      Plus: ({size=16,className=''}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      ),
      Trash2: ({size=16,className=''}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>
        </svg>
      ),
      Edit2: ({size=16,className=''}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
        </svg>
      ),
      ListTodo: ({size=16,className=''}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <rect x="3" y="5" width="6" height="6" rx="1"/><path d="m3 17 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>
        </svg>
      ),
      MapPin: ({size=16,className=''}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
        </svg>
      ),
      X: ({size=16,className=''}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      ),
      FileText: ({size=16,className=''}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
        </svg>
      ),
      Sun: ({size=16,className=''}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      ),
      Moon: ({size=16,className=''}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      ),
      ChevronLeft: ({size=16,className=''}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      ),
      ChevronRight: ({size=16,className=''}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      ),
      Award: ({size=16,className=''}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/>
        </svg>
      ),
      Sparkles: ({size=16,className=''}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/>
        </svg>
      ),
      Info: ({size=16,className=''}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
      ),
      Search: ({size=16,className=''}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      ),
    };

    const { CalendarIcon, CheckCircle2, Circle, Clock, Plus, Trash2, Edit2, ListTodo, MapPin, X, FileText, Sun, Moon, ChevronLeft, ChevronRight, Award, Sparkles, Info, Search } = icons;

    // ============ UTILIDADES DE FECHAS ============
    const getTodayFormatted = (dateOffset = 0) => {
      const d = new Date();
      if (dateOffset !== 0) d.setDate(d.getDate() + dateOffset);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    };

    const addOneHour = (timeStr) => {
      if (!timeStr) return '';
      const [h, m] = timeStr.split(':').map(Number);
      let newH = h + 1;
      if (newH >= 24) return '23:59';
      return `${String(newH).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
    };

    const calculateDuration = (start, end) => {
      if (!start || !end) return '';
      const [startH, startM] = start.split(':').map(Number);
      const [endH, endM] = end.split(':').map(Number);
      const diff = (endH * 60 + endM) - (startH * 60 + startM);
      if (diff <= 0) return '';
      const hours = Math.floor(diff / 60);
      const minutes = diff % 60;
      if (hours === 0) return `${minutes}min`;
      if (minutes === 0) return `${hours}h`;
      return `${hours}h ${minutes}min`;
    };

    // ============ INDEXEDDB ============
    const DB_NAME = 'PlannerProDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'planner_store';

    const openDB = () => new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error('IndexedDB no soportado')); return; }
      const request = window.indexedDB.open(DB_NAME, DB_VERSION);
      request.onerror = () => reject(request.error);
      request.onsuccess = () => resolve(request.result);
      request.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
      };
    });

    const getDBValue = async (key, defaultValue) => {
      try {
        const db = await openDB();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const req = tx.objectStore(STORE_NAME).get(key);
          req.onsuccess = () => resolve(req.result !== undefined ? req.result : defaultValue);
          req.onerror = () => resolve(defaultValue);
        });
      } catch { return defaultValue; }
    };

    const setDBValue = async (key, value) => {
      try {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          const req = tx.objectStore(STORE_NAME).put(value, key);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      } catch { /* silencioso */ }
    };

    // ============ DATOS PREDETERMINADOS ============
    const DEFAULT_TODOS = [
      { id: 1, title: 'Revisar métricas del tablero de RRHH', description: 'Revisar el desempeño Q2 y enviar reporte a gerencia.', status: 'En Proceso', category: 'Trabajo', priority: 'Alta', dueDate: getTodayFormatted(-1) },
      { id: 2, title: 'Preparar dinámicas para el examen de Súper Ciudadano', description: 'Buscar ejercicios interactivos en línea.', status: 'Pendiente', category: 'Personal', priority: 'Media', dueDate: getTodayFormatted(0) },
      { id: 3, title: 'Planificar sprint del proyecto nuevo', description: 'Definir tareas de desarrollo para las siguientes dos semanas.', status: 'Pendiente', category: 'Trabajo', priority: 'Alta', dueDate: getTodayFormatted(2) },
      { id: 4, title: 'Completar ciclo de respiración guiada (App Focus)', description: 'Sesión de 15 minutos antes de dormir.', status: 'Completada', category: 'Bienestar', priority: 'Baja', dueDate: '' },
    ];

    const DEFAULT_EVENTS = [
      { id: 1, title: 'Sesión de Planificación Trimestral', date: getTodayFormatted(0), startTime: '09:00', endTime: '10:30', category: 'Trabajo', location: 'Sala de Juntas / Meet', description: 'Definición de objetivos del departamento, asignación de presupuestos y revisión de líneas de contratación.' },
      { id: 2, title: 'Repasar estudio con mi hijo (Juegos Interactivos)', date: getTodayFormatted(0), startTime: '16:00', endTime: '17:30', category: 'Personal', location: 'Casa', description: 'Utilizar la app educativa para repasar los conceptos del examen escolar de forma interactiva.' },
      { id: 3, title: 'Rutina Fitness - Enfoque Mente Fuerte', date: getTodayFormatted(1), startTime: '07:00', endTime: '08:00', category: 'Bienestar', location: 'Gimnasio', description: 'Entrenamiento de alta intensidad centrado en disciplina y superación personal.' },
    ];

    // ============ APP PRINCIPAL ============
    function App() {
      const [darkMode, setDarkMode] = useState(() => {
        try { const s = localStorage.getItem('planner_darkMode'); return s ? JSON.parse(s) : false; } catch { return false; }
      });
      const [activeTab, setActiveTab] = useState('pendientes');
      const [currentDate, setCurrentDate] = useState(() => new Date());
      const [selectedDate, setSelectedDate] = useState(() => getTodayFormatted(0));
      const [searchQuery, setSearchQuery] = useState('');
      const [showTodoModal, setShowTodoModal] = useState(false);
      const [showEventModal, setShowEventModal] = useState(false);
      const [selectedEvent, setSelectedEvent] = useState(null);
      const [editingTodo, setEditingTodo] = useState(null);
      const [editingEvent, setEditingEvent] = useState(null);
      const [timeError, setTimeError] = useState('');
      const [toastMessage, setToastMessage] = useState(null);
      const [isDbLoaded, setIsDbLoaded] = useState(false);
      const [showSavedIndicator, setShowSavedIndicator] = useState(false);
      const savedTimerRef = useRef(null);
      const [pendingDelete, setPendingDelete] = useState(null);
      const [remainingTime, setRemainingTime] = useState(100);
      const progressIntervalRef = useRef(null);
      const [todos, setTodos] = useState([]);
      const [events, setEvents] = useState([]);
      const [todoFilter, setTodoFilter] = useState('Todos');
      const [newTodo, setNewTodo] = useState({ title: '', description: '', status: 'Pendiente', category: 'Trabajo', priority: 'Media', dueDate: '' });
      const [newEvent, setNewEvent] = useState({ title: '', date: getTodayFormatted(0), startTime: '09:00', endTime: '10:00', category: 'Trabajo', location: '', description: '' });

      // Load from IndexedDB
      useEffect(() => {
        (async () => {
          const savedTodos = await getDBValue('planner_todos', DEFAULT_TODOS);
          const savedEvents = await getDBValue('planner_events', DEFAULT_EVENTS);
          setTodos(savedTodos);
          setEvents(savedEvents);
          setIsDbLoaded(true);
        })();
      }, []);

      const triggerSavedIndicator = () => {
        setShowSavedIndicator(true);
        if (savedTimerRef.current) clearTimeout(savedTimerRef.current);
        savedTimerRef.current = setTimeout(() => setShowSavedIndicator(false), 2000);
      };

      useEffect(() => () => {
        if (savedTimerRef.current) clearTimeout(savedTimerRef.current);
        if (progressIntervalRef.current) clearInterval(progressIntervalRef.current);
      }, []);

      useEffect(() => { if (!isDbLoaded) return; setDBValue('planner_todos', todos).then(triggerSavedIndicator); }, [todos, isDbLoaded]);
      useEffect(() => { if (!isDbLoaded) return; setDBValue('planner_events', events).then(triggerSavedIndicator); }, [events, isDbLoaded]);

      useEffect(() => {
        try { localStorage.setItem('planner_darkMode', JSON.stringify(darkMode)); } catch {}
        if (darkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [darkMode]);

      // Time error validation
      useEffect(() => {
        if (!newEvent.startTime || !newEvent.endTime) { setTimeError(''); return; }
        const [startH, startM] = newEvent.startTime.split(':').map(Number);
        const [endH, endM] = newEvent.endTime.split(':').map(Number);
        if (endH * 60 + endM <= startH * 60 + startM) setTimeError('La hora de fin debe ser posterior a la de inicio.');
        else setTimeError('');
      }, [newEvent.startTime, newEvent.endTime]);

      useEffect(() => {
        if (!editingEvent) setNewEvent(prev => ({ ...prev, date: selectedDate }));
      }, [selectedDate, editingEvent]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      // Undo delete logic
      const startPendingDelete = (id, type) => {
        if (pendingDelete) commitPendingDelete();
        if (type === 'event' && selectedEvent && selectedEvent.id === id) setSelectedEvent(null);
        const timerId = setTimeout(() => {
          if (type === 'todo') setTodos(prev => prev.filter(t => t.id !== id));
          else setEvents(prev => prev.filter(e => e.id !== id));
          setPendingDelete(null);
          clearInterval(progressIntervalRef.current);
        }, 4000);
        setPendingDelete({ id, type, timerId });
        setRemainingTime(100);
        const startTime = Date.now();
        if (progressIntervalRef.current) clearInterval(progressIntervalRef.current);
        progressIntervalRef.current = setInterval(() => {
          const elapsed = Date.now() - startTime;
          const pct = Math.max(0, 100 - (elapsed / 4000) * 100);
          setRemainingTime(pct);
          if (elapsed >= 4000) clearInterval(progressIntervalRef.current);
        }, 50);
      };

      const commitPendingDelete = () => {
        if (!pendingDelete) return;
        clearTimeout(pendingDelete.timerId);
        clearInterval(progressIntervalRef.current);
        const { id, type } = pendingDelete;
        if (type === 'todo') setTodos(prev => prev.filter(t => t.id !== id));
        else setEvents(prev => prev.filter(e => e.id !== id));
        setPendingDelete(null);
      };

      const handleUndoDelete = () => {
        if (!pendingDelete) return;
        clearTimeout(pendingDelete.timerId);
        clearInterval(progressIntervalRef.current);
        setPendingDelete(null);
        showToast('Acción restaurada con éxito');
      };

      // Todo handlers
      const handleAddTodo = (e) => {
        e.preventDefault();
        if (!newTodo.title.trim()) return;
        if (editingTodo) {
          setTodos(todos.map(t => t.id === editingTodo.id ? { ...newTodo, id: editingTodo.id } : t));
          setEditingTodo(null);
          showToast('Tarea actualizada correctamente');
        } else {
          setTodos([...todos, { ...newTodo, id: Date.now() }]);
          showToast('¡Tarea creada con éxito!');
        }
        setNewTodo({ title: '', description: '', status: 'Pendiente', category: 'Trabajo', priority: 'Media', dueDate: '' });
        setShowTodoModal(false);
      };

      const handleEditTodoClick = (todo) => {
        setEditingTodo(todo);
        setNewTodo({ title: todo.title, description: todo.description || '', status: todo.status, category: todo.category, priority: todo.priority, dueDate: todo.dueDate || '' });
        setShowTodoModal(true);
      };

      const handleToggleTodoStatus = (id) => {
        setTodos(todos.map(todo => {
          if (todo.id === id) {
            const nextStatus = todo.status === 'Completada' ? 'Pendiente' : 'Completada';
            if (nextStatus === 'Completada') showToast('🎉 ¡Excelente trabajo, tarea completada!');
            return { ...todo, status: nextStatus };
          }
          return todo;
        }));
      };

      const handleStatusChange = (id, newStatus) => {
        setTodos(todos.map(todo => todo.id === id ? { ...todo, status: newStatus } : todo));
        if (newStatus === 'Completada') showToast('🎉 Tarea marcada como Completada');
      };

      // Event handlers
      const handleAddEvent = (e) => {
        e.preventDefault();
        if (!newEvent.title.trim()) return;
        const [startH, startM] = newEvent.startTime.split(':').map(Number);
        const [endH, endM] = newEvent.endTime.split(':').map(Number);
        if (endH * 60 + endM <= startH * 60 + startM) { setTimeError('La hora de fin debe ser posterior a la de inicio.'); return; }
        if (editingEvent) {
          setEvents(events.map(ev => ev.id === editingEvent.id ? { ...newEvent, id: editingEvent.id } : ev));
          setEditingEvent(null);
          showToast('📅 Evento actualizado con éxito');
        } else {
          setEvents([...events, { ...newEvent, id: Date.now() }]);
          showToast('📅 Evento añadido al calendario');
        }
        closeEventModal();
      };

      const handleEditEventClick = (event) => {
        setEditingEvent(event);
        setNewEvent({ title: event.title, date: event.date, startTime: event.startTime, endTime: event.endTime, category: event.category, location: event.location || '', description: event.description || '' });
        setSelectedEvent(null);
        setShowEventModal(true);
      };

      const closeEventModal = () => {
        setShowEventModal(false);
        setEditingEvent(null);
        setTimeError('');
        setNewEvent({ title: '', date: selectedDate, startTime: '09:00', endTime: '10:00', category: 'Trabajo', location: '', description: '' });
      };

      // Calendar helpers
      const getDaysInMonth = (date) => new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
      const getFirstDayOfMonth = (date) => new Date(date.getFullYear(), date.getMonth(), 1).getDay();
      const formatDateString = (year, month, day) => `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

      // Colors
      const getPriorityColor = (priority) => {
        if (priority === 'Alta') return darkMode ? 'text-red-400 bg-red-950/40 border-red-800/80' : 'text-red-600 bg-red-50 border-red-200';
        if (priority === 'Media') return darkMode ? 'text-amber-400 bg-amber-950/40 border-amber-800/80' : 'text-amber-600 bg-amber-50 border-amber-200';
        return darkMode ? 'text-blue-400 bg-blue-950/40 border-blue-800/80' : 'text-blue-600 bg-blue-50 border-blue-200';
      };

      const getCategoryColor = (cat) => {
        if (darkMode) {
          switch(cat) {
            case 'Trabajo': return { bg: 'bg-indigo-950/40', text: 'text-indigo-300', border: 'border-indigo-800/80', dot: 'bg-indigo-400' };
            case 'Personal': return { bg: 'bg-amber-950/40', text: 'text-amber-300', border: 'border-amber-800/80', dot: 'bg-amber-400' };
            case 'Bienestar': return { bg: 'bg-emerald-950/40', text: 'text-emerald-300', border: 'border-emerald-800/80', dot: 'bg-emerald-400' };
            default: return { bg: 'bg-slate-800/60', text: 'text-slate-300', border: 'border-slate-700', dot: 'bg-slate-400' };
          }
        } else {
          switch(cat) {
            case 'Trabajo': return { bg: 'bg-indigo-50', text: 'text-indigo-600', border: 'border-indigo-200', dot: 'bg-indigo-500' };
            case 'Personal': return { bg: 'bg-amber-50', text: 'text-amber-600', border: 'border-amber-200', dot: 'bg-amber-500' };
            case 'Bienestar': return { bg: 'bg-emerald-50', text: 'text-emerald-600', border: 'border-emerald-200', dot: 'bg-emerald-500' };
            default: return { bg: 'bg-slate-50', text: 'text-slate-600', border: 'border-slate-200', dot: 'bg-slate-500' };
          }
        }
      };

      const getDueDateBadge = (dueDate, status) => {
        if (!dueDate) return null;
        if (status === 'Completada') return (
          <span className="inline-flex items-center gap-1 text-[11px] font-medium text-slate-400 line-through mt-1">
            <Clock size={12} /> F. Límite: {dueDate}
          </span>
        );
        const todayStr = getTodayFormatted(0);
        if (dueDate < todayStr) return (
          <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-bold border ${darkMode ? 'text-red-400 bg-red-950/40 border-red-900/50' : 'text-red-700 bg-red-50 border-red-100'} mt-1.5 w-fit`}>
            <Clock size={12} className="animate-pulse" /> F. Límite: {dueDate} (Vencida ⚠️)
          </span>
        );
        if (dueDate === todayStr) return (
          <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-bold border ${darkMode ? 'text-amber-400 bg-amber-950/40 border-amber-900/50' : 'text-amber-700 bg-amber-50 border-amber-100'} mt-1.5 w-fit`}>
            <Clock size={12} /> F. Límite: {dueDate} (Hoy ⚡)
          </span>
        );
        const diffDays = Math.ceil((new Date(dueDate+'T00:00:00') - new Date(todayStr+'T00:00:00')) / 86400000);
        if (diffDays <= 3) return (
          <span className={`inline-flex items-center gap-1 text-[11px] font-bold ${darkMode ? 'text-yellow-400' : 'text-yellow-600'} mt-1.5`}>
            <Clock size={12} /> F. Límite: {dueDate} (Vence pronto)
          </span>
        );
        return (
          <span className={`inline-flex items-center gap-1 text-[11px] font-medium ${darkMode ? 'text-slate-400' : 'text-slate-500'} mt-1.5`}>
            <Clock size={12} /> F. Límite: {dueDate}
          </span>
        );
      };

      // Search
      const matchesSearchQuery = (item) => {
        if (!searchQuery.trim()) return true;
        const q = searchQuery.toLowerCase();
        return item.title?.toLowerCase().includes(q) || item.description?.toLowerCase().includes(q);
      };

      // Derived state
      const activeTodosForStats = todos.filter(t => !(pendingDelete && pendingDelete.type === 'todo' && pendingDelete.id === t.id));
      const activeEventsForStats = events.filter(e => !(pendingDelete && pendingDelete.type === 'event' && pendingDelete.id === e.id));
      const filteredTodos = todos.filter(t => {
        if (todoFilter !== 'Todos' && t.status !== todoFilter) return false;
        return matchesSearchQuery(t);
      });
      const selectedDayEvents = events.filter(e => e.date === selectedDate && matchesSearchQuery(e)).sort((a, b) => a.startTime.localeCompare(b.startTime));
      const totalMatchesCount = searchQuery.trim() !== '' ? (activeTodosForStats.filter(matchesSearchQuery).length + activeEventsForStats.filter(matchesSearchQuery).length) : 0;
      const totalTodos = activeTodosForStats.length;
      const completedTodos = activeTodosForStats.filter(t => t.status === 'Completada').length;
      const processTodos = activeTodosForStats.filter(t => t.status === 'En Proceso').length;
      const percentComplete = totalTodos > 0 ? Math.round((completedTodos / totalTodos) * 100) : 0;
      const currentDuration = calculateDuration(newEvent.startTime, newEvent.endTime);

      // Calendar grid
      const renderCalendarGrid = () => {
        const daysInMonth = getDaysInMonth(currentDate);
        const firstDay = getFirstDayOfMonth(currentDate);
        const grid = [];
        const todayStr = getTodayFormatted(0);

        for (let i = 0; i < firstDay; i++) {
          grid.push(<div key={`empty-${i}`} className={`min-h-[85px] sm:min-h-[100px] rounded-xl border border-dashed ${darkMode ? 'border-slate-800/40 bg-slate-900/10' : 'border-slate-200/50 bg-slate-50/20'}`} />);
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const dateStr = formatDateString(currentDate.getFullYear(), currentDate.getMonth(), day);
          const dayEvents = events.filter(e => e.date === dateStr);
          const dayActiveEvents = dayEvents.filter(e => !(pendingDelete && pendingDelete.type === 'event' && pendingDelete.id === e.id));
          const hasMatchingEvents = searchQuery.trim() !== '' && dayActiveEvents.some(matchesSearchQuery);
          const isToday = dateStr === todayStr;
          const isSelected = dateStr === selectedDate;

          grid.push(
            <div key={`day-${day}`} onClick={() => setSelectedDate(dateStr)}
              className={`min-h-[85px] sm:min-h-[100px] rounded-xl border p-1 sm:p-2 flex flex-col justify-between transition-all duration-200 hover:shadow-md cursor-pointer ${
                isSelected ? (darkMode ? 'border-blue-500 bg-blue-950/40 ring-1 ring-blue-500/50' : 'border-blue-500 bg-blue-50/80 ring-1 ring-blue-500/40')
                : hasMatchingEvents ? 'border-pink-500 bg-pink-500/10 ring-2 ring-pink-500'
                : darkMode ? `border-slate-800 hover:border-slate-600 ${isToday ? 'bg-blue-950/30 border-blue-500/80' : 'bg-slate-900/40'}`
                : `border-slate-200 hover:border-slate-300 ${isToday ? 'bg-blue-50/30 border-blue-400' : 'bg-white'}`
              }`}>
              <div className="flex justify-between items-center">
                <span className={`text-xs font-semibold p-1 rounded-lg w-6 h-6 flex items-center justify-center ${
                  isSelected ? 'bg-blue-600 text-white shadow-sm'
                  : isToday ? (darkMode ? 'bg-blue-500/20 text-blue-400 font-bold' : 'bg-blue-600 text-white font-bold shadow-sm')
                  : (darkMode ? 'text-slate-300' : 'text-slate-700')
                }`}>{day}</span>
                {dayActiveEvents.length > 0 && (
                  <span className="flex h-2 w-2 relative">
                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75" />
                    <span className="relative inline-flex rounded-full h-2 w-2 bg-blue-500" />
                  </span>
                )}
              </div>
              <div className="overflow-y-auto space-y-1 mt-1 flex-1 scrollbar-none w-full" style={{maxHeight:'60px'}}>
                {dayEvents.slice(0, 3).map(e => {
                  const colors = getCategoryColor(e.category);
                  const matches = searchQuery.trim() !== '' && matchesSearchQuery(e);
                  const isDeleting = pendingDelete && pendingDelete.type === 'event' && pendingDelete.id === e.id;
                  return (
                    <div key={e.id} onClick={evt => { evt.stopPropagation(); setSelectedEvent(e); }}
                      className={`text-[9px] sm:text-[10px] px-1 py-0.5 rounded border truncate cursor-pointer transition-transform hover:scale-[1.02] font-medium ${
                        isDeleting ? 'opacity-30 line-through bg-red-500/10 border-red-500/20 text-red-500'
                        : matches ? 'bg-pink-500 text-white border-pink-400 font-bold shadow-sm'
                        : `${colors.bg} ${colors.text} ${colors.border}`
                      }`} title={e.title}>
                      {e.startTime} {e.title}
                    </div>
                  );
                })}
                {dayEvents.length > 3 && <p className="text-[8px] text-slate-400 text-center font-medium">+{dayEvents.length - 3} más</p>}
              </div>
            </div>
          );
        }
        return grid;
      };

      const inputCls = `w-full text-sm border rounded-xl px-3 py-2.5 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all ${darkMode ? 'bg-slate-900 border-slate-700 text-slate-100' : 'bg-slate-50 border-slate-200 text-slate-800'}`;
      const selectCls = `w-full text-sm border rounded-xl px-3 py-2.5 focus:outline-none focus:ring-1 focus:ring-slate-400 ${darkMode ? 'bg-slate-900 border-slate-700 text-slate-200' : 'bg-slate-50 border-slate-200 text-slate-700'}`;

      return (
        <div className={`min-h-screen transition-colors duration-300 pb-20 ${darkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-50 text-slate-800'}`}>

          {/* Toast */}
          {toastMessage && (
            <div className="fixed top-5 right-5 z-50 flex items-center gap-2 px-4 py-3 rounded-2xl shadow-xl border bg-slate-900/90 text-white border-slate-700/50 backdrop-blur-md animate-in fade-in">
              <Sparkles size={16} className="text-amber-400" />
              <span className="text-sm font-medium">{toastMessage}</span>
            </div>
          )}

          {/* HEADER */}
          <header className={`sticky top-0 z-40 backdrop-blur-md border-b px-4 sm:px-6 py-4 flex flex-col lg:flex-row justify-between items-center gap-4 transition-colors ${darkMode ? 'bg-slate-950/80 border-slate-800' : 'bg-white/80 border-slate-200'}`}>
            <div className="flex items-center gap-3 w-full lg:w-auto justify-between lg:justify-start">
              <div className="flex items-center gap-3">
                <div className="p-2.5 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-600 text-white shadow-md flex-shrink-0">
                  <CalendarIcon size={22} />
                </div>
                <div>
                  <div className="flex items-center gap-2.5">
                    <h1 className={`text-xl font-extrabold tracking-tight ${darkMode ? 'text-white' : 'text-slate-900'}`}>My Planner Pro</h1>
                    {showSavedIndicator && (
                      <span className="inline-flex items-center gap-1 text-[10px] font-bold text-emerald-500 animate-in fade-in bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">
                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse" /> Guardado ✓
                      </span>
                    )}
                  </div>
                  <p className={`text-xs ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>Organiza tareas, prioridades y eventos.</p>
                </div>
              </div>
            </div>

            <div className="flex items-center justify-between lg:justify-end gap-2 sm:gap-3 w-full lg:w-auto flex-nowrap overflow-x-auto lg:overflow-x-visible pb-1 lg:pb-0 scrollbar-none">
              {/* Tab switcher */}
              <div className={`flex items-center gap-0.5 p-1 rounded-xl border flex-shrink-0 ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-slate-100 border-slate-200'}`}>
                {[['pendientes', <ListTodo size={15} />, 'Tareas'], ['calendario', <CalendarIcon size={15} />, 'Calendario']].map(([tab, icon, label]) => (
                  <button key={tab} onClick={() => setActiveTab(tab)}
                    className={`flex items-center gap-1.5 px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all duration-200 ${
                      activeTab === tab ? (darkMode ? 'bg-slate-800 text-white shadow-sm' : 'bg-white text-slate-900 shadow-sm') : (darkMode ? 'text-slate-400 hover:text-white' : 'text-slate-600 hover:text-slate-900')
                    }`}>
                    {icon}<span>{label}</span>
                  </button>
                ))}
              </div>

              {/* Search */}
              <div className="relative flex items-center w-36 xs:w-44 sm:w-56 flex-shrink-0">
                <input type="text" placeholder="Buscar..." value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  className={`w-full text-xs border rounded-xl pl-3 pr-8 py-2.5 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all ${darkMode ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-slate-50 border-slate-200 text-slate-800'}`} />
                {searchQuery && (
                  <button type="button" onClick={() => setSearchQuery('')}
                    className="absolute right-2.5 p-1 rounded-full text-slate-400 hover:text-slate-600 transition-colors">
                    <X size={14} />
                  </button>
                )}
                {searchQuery.trim() !== '' && (
                  <span className="absolute -top-2.5 -right-2 bg-gradient-to-r from-pink-500 to-rose-500 text-white text-[9px] font-extrabold px-1.5 py-0.5 rounded-full shadow-md">
                    {totalMatchesCount}
                  </span>
                )}
              </div>

              {/* Dark mode toggle */}
              <button onClick={() => setDarkMode(!darkMode)}
                className={`p-2.5 rounded-xl border transition-all shadow-sm flex-shrink-0 ${darkMode ? 'bg-slate-900/60 border-slate-800 text-amber-400 hover:bg-slate-800' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-100'}`}>
                {darkMode ? <Sun size={18} /> : <Moon size={18} />}
              </button>
            </div>
          </header>

          {/* MAIN */}
          <main className="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">

            {/* ======= PESTAÑA PENDIENTES ======= */}
            {activeTab === 'pendientes' && (
              <div className="space-y-6">
                {/* Stats */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  {[
                    { label: 'Tareas Totales', value: totalTodos, color: darkMode ? 'text-white' : 'text-slate-900', icon: <ListTodo size={20} />, iconBg: darkMode ? 'bg-slate-800 text-blue-400' : 'bg-blue-50 text-blue-600' },
                    { label: 'En Proceso', value: processTodos, color: darkMode ? 'text-amber-400' : 'text-amber-600', icon: <Clock size={20} />, iconBg: darkMode ? 'bg-slate-800 text-amber-400' : 'bg-amber-50 text-amber-600' },
                    { label: 'Completadas', value: `${completedTodos} (${percentComplete}%)`, color: darkMode ? 'text-emerald-400' : 'text-emerald-600', icon: <Award size={20} />, iconBg: darkMode ? 'bg-slate-800 text-emerald-400' : 'bg-emerald-50 text-emerald-600' },
                  ].map(({ label, value, color, icon, iconBg }) => (
                    <div key={label} className={`p-4 rounded-2xl border flex items-center justify-between shadow-sm ${darkMode ? 'bg-slate-900/40 border-slate-800' : 'bg-white border-slate-200'}`}>
                      <div className="space-y-1">
                        <span className="text-xs font-semibold text-slate-400 block">{label}</span>
                        <span className={`text-2xl font-bold ${color}`}>{value}</span>
                      </div>
                      <div className={`p-3 rounded-xl ${iconBg}`}>{icon}</div>
                    </div>
                  ))}
                </div>

                {/* Filters + Add button */}
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                  <div className={`flex flex-wrap gap-2 p-1.5 rounded-xl border shadow-sm ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                    {['Todos', 'Pendiente', 'En Proceso', 'Completada'].map(filter => (
                      <button key={filter} onClick={() => setTodoFilter(filter)}
                        className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 ${
                          todoFilter === filter ? (darkMode ? 'bg-slate-800 text-white shadow-sm' : 'bg-slate-900 text-white shadow-sm') : (darkMode ? 'text-slate-400 hover:bg-slate-800' : 'text-slate-600 hover:bg-slate-50')
                        }`}>
                        {filter === 'Pendiente' && '⏳ '}
                        {filter === 'En Proceso' && '🔄 '}
                        {filter === 'Completada' && '✅ '}
                        {filter}
                      </button>
                    ))}
                  </div>
                  <button onClick={() => { setEditingTodo(null); setNewTodo({ title: '', description: '', status: 'Pendiente', category: 'Trabajo', priority: 'Media', dueDate: '' }); setShowTodoModal(true); }}
                    className={`flex items-center gap-2 px-5 py-3 rounded-xl text-sm font-bold tracking-tight transition-all duration-200 shadow-md active:scale-95 w-full sm:w-auto justify-center ${darkMode ? 'bg-white hover:bg-slate-100 text-slate-950' : 'bg-slate-950 hover:bg-slate-900 text-white'}`}>
                    <Plus size={16} /> Nuevo Pendiente
                  </button>
                </div>

                {/* Todo list */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                  {!isDbLoaded ? (
                    <div className="col-span-full text-center py-12 text-slate-400">
                      <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500 mx-auto mb-2" />
                      <p className="text-sm font-semibold">Cargando tareas guardadas...</p>
                    </div>
                  ) : filteredTodos.length === 0 ? (
                    <div className={`col-span-full border border-dashed rounded-3xl p-16 text-center ${darkMode ? 'border-slate-800 bg-slate-900/10 text-slate-500' : 'border-slate-300 bg-slate-50/50 text-slate-400'}`}>
                      <ListTodo className="mx-auto mb-3 opacity-40 text-blue-500 animate-pulse" size={44} />
                      <p className="text-sm font-semibold">No se encontraron pendientes en esta sección.</p>
                      <p className="text-xs text-slate-400 mt-1">¡Intenta cambiar los filtros o tu búsqueda!</p>
                    </div>
                  ) : filteredTodos.map(todo => {
                    const isCompleted = todo.status === 'Completada';
                    const colors = getCategoryColor(todo.category);
                    const isDeleting = pendingDelete && pendingDelete.type === 'todo' && pendingDelete.id === todo.id;
                    return (
                      <div key={todo.id} className={`border rounded-2xl p-5 flex flex-col justify-between gap-4 transition-all duration-200 hover:shadow-md ${
                        isDeleting ? (darkMode ? 'bg-red-950/20 border-red-900/40 opacity-50' : 'bg-red-50/50 opacity-50 border-red-200')
                        : darkMode ? `bg-slate-900/60 ${isCompleted ? 'border-slate-800/40 opacity-50' : 'border-slate-800/80 hover:border-slate-700'}`
                        : `bg-white ${isCompleted ? 'border-slate-200 opacity-70' : 'border-slate-200/80 hover:border-slate-300'}`
                      }`}>
                        <div className="flex items-start gap-3">

                    <input type="text" placeholder="Ej. Sala de juntas / Enlace de Meet" value={newEvent.location} onChange={e => setNewEvent({...newEvent, location: e.target.value})} className={inputCls} />
                  </div>
                  <div className="space-y-1.5">
                    <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">Descripción (Opcional)</label>
                    <textarea placeholder="Especifica notas, puntos clave o agenda del evento..." rows="3" value={newEvent.description} onChange={e => setNewEvent({...newEvent, description: e.target.value})} className={`${inputCls} resize-none`} />
                  </div>
                </div>
                <div className={`px-6 py-4 border-t flex justify-end gap-2.5 ${darkMode ? 'bg-slate-900/60 border-slate-800' : 'bg-slate-50 border-slate-100'}`}>
                  <button type="button" onClick={closeEventModal} className="text-xs font-bold text-slate-500 hover:text-slate-600 px-4 py-2.5">Cancelar</button>
                  <button type="submit" disabled={!!timeError} className={`text-xs font-bold px-5 py-2.5 rounded-xl transition-all shadow-md active:scale-95 ${timeError ? 'opacity-50 cursor-not-allowed bg-slate-400 text-slate-200' : (darkMode ? 'bg-white hover:bg-slate-100 text-slate-950' : 'bg-slate-950 hover:bg-slate-900 text-white')}`}>
                    {editingEvent ? 'Guardar Cambios' : 'Agendar Evento'}
                  </button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- Service Worker + PWA Install -->
  <script>
    // Inline Service Worker via Blob URL (no separate sw.js needed)
    const swCode = `
      const CACHE = 'my-planner-pwa-v1';
      const ASSETS = ['/', '/MyPlannerPro.html'];

      self.addEventListener('install', e => {
        e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS).catch(()=>{})));
        self.skipWaiting();
      });
      self.addEventListener('activate', e => {
        e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));
        self.clients.claim();
      });
      self.addEventListener('fetch', e => {
        if (e.request.method !== 'GET') return;
        e.respondWith(
          caches.match(e.request).then(cached => {
            const net = fetch(e.request).then(r => {
              if (r && r.status === 200 && r.type === 'basic') {
                const clone = r.clone();
                caches.open(CACHE).then(c => c.put(e.request, clone));
              }
              return r;
            }).catch(() => cached);
            return cached || net;
          })
        );
      });
    `;

    if ('serviceWorker' in navigator) {
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl, { scope: '/' })
        .then(() => console.log('✅ My Planner PWA: Service Worker activo'))
        .catch(e => console.log('SW info:', e.message));
    }

    // Install prompt
    let deferredPrompt;
    const banner = document.getElementById('pwa-banner');
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      banner.classList.add('visible');
      banner.style.display = 'flex';
    });
    document.getElementById('pwa-install-btn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      banner.style.display = 'none';
    });
    document.getElementById('pwa-dismiss-btn').addEventListener('click', () => {
      banner.style.display = 'none';
    });
    window.addEventListener('appinstalled', () => {
      banner.style.display = 'none';
      console.log('✅ My Planner Pro instalada como app');
    });
  </script>
</body>
</html>
